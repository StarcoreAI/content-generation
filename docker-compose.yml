services:
  geo-content:
    build: .
    container_name: geo-content
    env_file:
      - .env
    environment:
      GEO_HOST: 0.0.0.0
      GEO_PORT: 5000
      GEO_SECRET_KEY: ${GEO_SECRET_KEY:?set GEO_SECRET_KEY in .env}
    ports:
      - "8080:5000"
    volumes:
      - ./data:/app/data
      - ./pdf:/app/pdf
      - ./logs:/app/logs
    restart: unless-stopped
